spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${TX_DB_URL:jdbc:mysql://127.0.0.1:3306/tianxin_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${TX_DB_USERNAME:root}
    password: ${TX_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
